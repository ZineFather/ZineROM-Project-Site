name: ZineROM Info Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - zinerom-info-development
    paths:
      - "android-app/**"
      - ".github/workflows/zinerom-info-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: zinerom-info-development

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure Firebase Android client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add GOOGLE_SERVICES_JSON (or FIREBASE_GOOGLE_SERVICES_JSON) as a repository Actions secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          jq -e '.project_info.project_id and (.client[0].client_info.android_client_info.package_name == "com.zinerom.info")' android-app/app/google-services.json >/dev/null

      - name: Build ZineROM Info 3.3.4 APK
        env:
          ZINEROM_SIGNING_KEYSTORE_BASE64: ${{ secrets.ZINEROM_SIGNING_KEYSTORE_BASE64 }}
          ZINEROM_SIGNING_STORE_PASSWORD: ${{ secrets.ZINEROM_SIGNING_STORE_PASSWORD }}
          ZINEROM_SIGNING_KEY_ALIAS: ${{ secrets.ZINEROM_SIGNING_KEY_ALIAS }}
          ZINEROM_SIGNING_KEY_PASSWORD: ${{ secrets.ZINEROM_SIGNING_KEY_PASSWORD }}
        run: gradle -p android-app :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Info-3.3.4-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
