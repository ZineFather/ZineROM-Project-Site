name: ZineROM Info APK Build

on:
  push:
    branches:
      - zinerom-info-development
    paths:
      - "android-app/**"
      - ".github/workflows/zinerom-info-apk.yml"
  workflow_dispatch:

concurrency:
  group: zinerom-info-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Firebase client (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON is not configured. Building the APK without Firebase push notifications."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android-app/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[]?.client_info.android_client_info.package_name // empty' android-app/app/google-services.json | head -n 1)
          if [ "$PROJECT_ID" != "zinerom-updates" ]; then
            echo "::error::Wrong Firebase project: expected zinerom-updates, got $PROJECT_ID"
            exit 1
          fi
          if [ "$PACKAGE_NAME" != "com.zinerom.info" ]; then
            echo "::error::Wrong Firebase Android package: expected com.zinerom.info, got $PACKAGE_NAME"
            exit 1
          fi
          echo "Firebase client validated for $PROJECT_ID / $PACKAGE_NAME."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        env:
          ZINEROM_SIGNING_KEYSTORE_BASE64: ${{ secrets.ZINEROM_SIGNING_KEYSTORE_BASE64 }}
          ZINEROM_SIGNING_STORE_PASSWORD: ${{ secrets.ZINEROM_SIGNING_STORE_PASSWORD }}
          ZINEROM_SIGNING_KEY_ALIAS: ${{ secrets.ZINEROM_SIGNING_KEY_ALIAS }}
          ZINEROM_SIGNING_KEY_PASSWORD: ${{ secrets.ZINEROM_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ZINEROM_SIGNING_KEYSTORE_BASE64" ] || [ -z "$ZINEROM_SIGNING_STORE_PASSWORD" ] || [ -z "$ZINEROM_SIGNING_KEY_ALIAS" ] || [ -z "$ZINEROM_SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Stable signing secrets are incomplete; this debug APK will use the runner's temporary debug certificate and is not suitable for in-place upgrades."
          fi
          gradle --no-daemon clean assembleDebug
        working-directory: android-app

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Info-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
