name: ZineROM Info APK Build

on:
  push:
    branches:
      - zinerom-info-development
    paths:
      - "android-app/**"
      - ".github/workflows/zinerom-info-apk.yml"
  workflow_dispatch:

concurrency:
  group: zinerom-info-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Firebase client (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON is not configured. Building the APK without Firebase push notifications."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android-app/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[]?.client_info.android_client_info.package_name // empty' android-app/app/google-services.json | head -n 1)
          if [ "$PROJECT_ID" != "zinerom-updates" ]; then
            echo "::error::Wrong Firebase project: expected zinerom-updates, got $PROJECT_ID"
            exit 1
          fi
          if [ "$PACKAGE_NAME" != "com.zinerom.info" ]; then
            echo "::error::Wrong Firebase Android package: expected com.zinerom.info, got $PACKAGE_NAME"
            exit 1
          fi
          echo "Firebase client validated for $PROJECT_ID / $PACKAGE_NAME."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Checkout ZineROM platform signing certificate
        uses: actions/checkout@v4
        with:
          repository: ZineFather/ZineROM8.5-A52s
          ref: seventeen-s26u
          path: rom-source

      - name: Build unsigned release APK
        run: gradle --no-daemon clean assembleRelease
        working-directory: android-app

      - name: Sign APK with the ZineROM platform certificate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android-app/app/build/outputs/apk/release/ZineROM-Info-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/release/ZineROM-Info-3.2.7.apk"
          test -s "$UNSIGNED"
          test -s "rom-source/security/aosp_platform.pk8"
          test -s "rom-source/security/aosp_platform.x509.pem"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --key rom-source/security/aosp_platform.pk8 --cert rom-source/security/aosp_platform.x509.pem --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED"
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Info-3.2.7-ROM-signed
          path: android-app/app/build/outputs/apk/release/ZineROM-Info-3.2.7.apk
          if-no-files-found: error
          retention-days: 14
