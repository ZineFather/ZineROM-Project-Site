name: ZineROM Info Android Build
on:
  push:
    branches: [zinerom-info-development]
    paths: ["android-app/**", ".github/workflows/zinerom-info-android.yml"]
  pull_request:
    branches: [main]
    paths: ["android-app/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Info-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
