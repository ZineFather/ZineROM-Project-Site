name: ZineROM Info Android Build
on:
  push:
    branches: [zinerom-info-development]
    paths: ["android-app/**", ".github/workflows/zinerom-info-android.yml"]
  pull_request:
    branches: [main]
    paths: ["android-app/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Configure and validate Firebase client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required; refusing to build an APK without Firebase."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android-app/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[]?.client_info.android_client_info.package_name // empty' android-app/app/google-services.json | head -n 1)
          if [ "$PROJECT_ID" != "zinerom-updates" ]; then
            echo "::error::Wrong Firebase project in GOOGLE_SERVICES_JSON: expected zinerom-updates, got $PROJECT_ID"
            exit 1
          fi
          if [ "$PACKAGE_NAME" != "com.zinerom.info" ]; then
            echo "::error::Wrong Firebase Android package: expected com.zinerom.info, got $PACKAGE_NAME"
            exit 1
          fi
          echo "Firebase client validated for $PROJECT_ID / $PACKAGE_NAME."
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Info-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
